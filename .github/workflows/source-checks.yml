name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and shared Ziren pin
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in [*Path('scripts').glob('*.py'), *Path('contracts').rglob('*.py')]:
              ast.parse(path.read_text(), filename=str(path))
          PY
          python3 scripts/check-dependencies.py
      - name: Reference compiler arithmetic checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 contracts/ziren-shrink-verifier/test-compiler.py

  shrink-export:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/opsuccinct-shrink-target
      GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-17
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p opsuccinct-shrink-export --lib
      - run: cargo check --locked -p opsuccinct-shrink-export --features machine --tests

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build verifier contracts
        run: forge build --root contracts/ziren-shrink-verifier
      - name: Fixture-free Foundry tests
        run: >-
          forge test --root contracts/ziren-shrink-verifier
          --no-match-contract 'KeccakTerminalVerifierTest|OptimizedKernelsTest|KeccakWireReaderTest|StackedWhirTest'
