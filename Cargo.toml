[workspace]
members = ["crates/ziren-shrink-export"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ProjectZKM/OPSuccinct"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc", "rc"] }
serde_json = "1"
anyhow = "1"
zkm-pcs = { git = "https://github.com/ProjectZKM/Ziren.git", branch = "feat/keccak-terminal-evm" }
zkm-prover = { git = "https://github.com/ProjectZKM/Ziren.git", branch = "feat/keccak-terminal-evm" }
zkm-core-machine = { git = "https://github.com/ProjectZKM/Ziren.git", branch = "feat/keccak-terminal-evm" }
zkm-core-executor = { git = "https://github.com/ProjectZKM/Ziren.git", branch = "feat/keccak-terminal-evm" }
zkm-recursion-core = { git = "https://github.com/ProjectZKM/Ziren.git", branch = "feat/keccak-terminal-evm" }
zkm-primitives = { git = "https://github.com/ProjectZKM/Ziren.git", branch = "feat/keccak-terminal-evm" }
p3-field = { git = "https://github.com/ProjectZKM/Plonky3" }
p3-keccak = { git = "https://github.com/ProjectZKM/Plonky3" }
p3-symmetric = { git = "https://github.com/ProjectZKM/Plonky3" }
p3-air = { git = "https://github.com/ProjectZKM/Plonky3" }
p3-koala-bear = { git = "https://github.com/ProjectZKM/Plonky3" }
p3-uni-stark = { git = "https://github.com/ProjectZKM/Plonky3" }
