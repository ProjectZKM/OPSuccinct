[workspace]
members = ["crates/shrink-export"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ProjectZKM/OPSuccinct"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc", "rc"] }
serde_json = "1"
anyhow = "1"
zkm-pcs = { git = "https://github.com/ProjectZKM/Ziren.git", rev = "82ceeae13222fcf8cd7532e516108a5ab71fe28d" }
zkm-prover = { git = "https://github.com/ProjectZKM/Ziren.git", rev = "82ceeae13222fcf8cd7532e516108a5ab71fe28d" }
zkm-core-machine = { git = "https://github.com/ProjectZKM/Ziren.git", rev = "82ceeae13222fcf8cd7532e516108a5ab71fe28d" }
zkm-core-executor = { git = "https://github.com/ProjectZKM/Ziren.git", rev = "82ceeae13222fcf8cd7532e516108a5ab71fe28d" }
zkm-recursion-core = { git = "https://github.com/ProjectZKM/Ziren.git", rev = "82ceeae13222fcf8cd7532e516108a5ab71fe28d" }
zkm-primitives = { git = "https://github.com/ProjectZKM/Ziren.git", rev = "82ceeae13222fcf8cd7532e516108a5ab71fe28d" }
p3-field = { git = "https://github.com/ProjectZKM/Plonky3", rev = "4dd0d47a8176503fbaa7293c9f0e3b20004e16b2" }
p3-keccak = { git = "https://github.com/ProjectZKM/Plonky3", rev = "4dd0d47a8176503fbaa7293c9f0e3b20004e16b2" }
p3-symmetric = { git = "https://github.com/ProjectZKM/Plonky3", rev = "4dd0d47a8176503fbaa7293c9f0e3b20004e16b2" }
p3-air = { git = "https://github.com/ProjectZKM/Plonky3", rev = "4dd0d47a8176503fbaa7293c9f0e3b20004e16b2" }
p3-koala-bear = { git = "https://github.com/ProjectZKM/Plonky3", rev = "4dd0d47a8176503fbaa7293c9f0e3b20004e16b2" }
p3-uni-stark = { git = "https://github.com/ProjectZKM/Plonky3", rev = "4dd0d47a8176503fbaa7293c9f0e3b20004e16b2" }
